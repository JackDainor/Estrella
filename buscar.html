<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Casas en Alquiler - Puertas Abiertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .property-card {
            transition: all 0.3s ease;
        }
        .property-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition">
                    <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white text-2xl font-bold">PA</div>
                    <div>
                        <h1 class="text-2xl font-bold text-emerald-700">Puertas Abiertas</h1>
                        <p class="text-xs text-emerald-600 -mt-1">Satélite Norte</p>
                    </div>
                </a>
            </div>
            <a href="index.html" class="text-emerald-600 hover:text-emerald-700 font-medium flex items-center gap-2">
                ← Volver al Inicio
            </a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-10">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <h1 class="text-5xl font-bold text-gray-900">Casas en Alquiler</h1>
                <p class="text-gray-600 text-xl mt-2">Encuentra tu próximo hogar en Satélite Norte</p>
            </div>
            
            <!-- Filtros -->
            <div class="flex flex-wrap gap-4">
                <div class="relative">
                    <input type="text" id="searchInput" 
                           placeholder="Buscar por zona o palabra..." 
                           class="pl-10 pr-4 py-3 w-80 border border-gray-300 rounded-2xl focus:outline-none focus:border-emerald-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
                
                <select id="priceFilter" class="px-5 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-emerald-500">
                    <option value="">Precio</option>
                    <option value="5000">Hasta $5,000</option>
                    <option value="10000">Hasta $10,000</option>
                    <option value="15000">Hasta $15,000</option>
                    <option value="all">Todos</option>
                </select>
                
                <select id="roomsFilter" class="px-5 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-emerald-500">
                    <option value="">Habitaciones</option>
                    <option value="1">1+</option>
                    <option value="2">2+</option>
                    <option value="3">3+</option>
                </select>
            </div>
        </div>

        <!-- Resultados -->
        <div id="propertiesGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Las tarjetas se generan con JavaScript -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-12 text-center text-sm">
        <p>&copy; 2026 Puertas Abiertas en Satélite Norte. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Datos de ejemplo (en el futuro vendrán de una base de datos)
        const properties = [
            {
                id: 1,
                title: "Casa moderna con jardín",
                address: "Av. Satélite Norte 456, Satélite Norte",
                price: 200,
                rooms: 3,
                bathrooms: 2,
                size: 120,
                description: "Hermosa casa recién remodelada, cocina integral, sala amplia, excelente ubicación cerca de comercios.",
                image: "casas/casa1.jpg",
                whatsapp: "+591 63614354"
            },
            {
                id: 2,
                title: "Casa familiar amplia",
                address: "Calle Luna 123, Satélite Norte",
                price: 12500,
                rooms: 4,
                bathrooms: 3,
                size: 180,
                description: "Ideal para familias. Cuenta con 4 habitaciones, 3 baños, garage para 2 autos y patio trasero.",
                image: "https://picsum.photos/id/133/600/400",
                whatsapp: "+525598765432"
            },
            {
                id: 3,
                title: "Casa económica cómoda",
                address: "Privada Estrella 89, Satélite Norte",
                price: 6800,
                rooms: 2,
                bathrooms: 1,
                size: 85,
                description: "Perfecta para pareja o persona sola. Ubicación tranquila y segura.",
                image: "https://picsum.photos/id/201/600/400",
                whatsapp: "+525511223344"
            }
        ];

        function renderProperties(filteredProperties) {
            const container = document.getElementById('propertiesGrid');
            container.innerHTML = '';

            filteredProperties.forEach(property => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl overflow-hidden property-card border border-gray-100";
                card.innerHTML = `
                    <img src="\( {property.image}" alt=" \){property.title}" class="w-full h-56 object-cover"
                         onerror="this.src='https://picsum.photos/600/400?grayscale'; this.onerror=null;">
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-bold text-2xl">$${property.price.toLocaleString('es-MX')}</h3>
                                <p class="text-emerald-600 text-sm font-medium">al mes</p>
                            </div>
                            <div class="text-right text-sm">
                                <div>${property.rooms} hab • ${property.bathrooms} baños</div>
                                <div class="text-gray-500">${property.size} m²</div>
                            </div>
                        </div>
                        
                        <h4 class="font-semibold text-lg mb-1">${property.title}</h4>
                        <p class="text-gray-500 text-sm mb-4 flex items-center gap-1">
                            <i class="fa-solid fa-location-dot"></i> ${property.address}
                        </p>
                        
                        <p class="text-gray-600 text-sm line-clamp-3 mb-6">${property.description}</p>
                        
                        <button onclick="contactOwner('\( {property.whatsapp}', ' \){property.title}')" 
                                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold flex items-center justify-center gap-3 transition-colors">
                            <i class="fa-brands fa-whatsapp text-xl"></i>
                            Contactar por WhatsApp
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Función para contactar
        function contactOwner(phone, title) {
            const message = `Hola, estoy interesado en la propiedad: ${title}. ¿Está disponible?`;
            const cleanPhone = phone.replace(/\D/g, '');
            const url = `https://wa.me/\( {cleanPhone}?text= \){encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        // Filtros en tiempo real
        function filterProperties() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const maxPrice = document.getElementById('priceFilter').value;
            const minRooms = parseInt(document.getElementById('roomsFilter').value) || 0;

            const filtered = properties.filter(prop => {
                const matchesSearch = prop.title.toLowerCase().includes(searchTerm) || 
                                    prop.address.toLowerCase().includes(searchTerm) ||
                                    prop.description.toLowerCase().includes(searchTerm);
                
                const matchesPrice = !maxPrice || maxPrice === 'all' || prop.price <= parseInt(maxPrice);
                const matchesRooms = prop.rooms >= minRooms;
                
                return matchesSearch && matchesPrice && matchesRooms;
            });

            renderProperties(filtered);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            renderProperties(properties);
            
            // Eventos de filtro
            document.getElementById('searchInput').addEventListener('input', filterProperties);
            document.getElementById('priceFilter').addEventListener('change', filterProperties);
            document.getElementById('roomsFilter').addEventListener('change', filterProperties);
        });
    </script>
</body>
</html>
