<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Puertas Abiertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Pantalla de login simple -->
    <div id="pantallaLogin" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white rounded-2xl shadow-lg p-8 max-w-sm w-full">
            <h1 class="text-2xl font-bold text-center mb-2">Administrador</h1>
            <p class="text-center text-gray-500 text-sm mb-6">Solo para el intermediario</p>
            <label class="block text-sm mb-1">Contraseña</label>
            <input type="password" id="inputClave" placeholder="Escribe la clave"
                   class="w-full border border-gray-300 rounded-xl px-4 py-3 mb-4">
            <button onclick="entrar()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-semibold">
                Entrar
            </button>
            <p class="text-xs text-gray-400 text-center mt-4">
                La clave está en js/firebase-config.js (CLAVE_ADMIN)
            </p>
            <a href="index.html" class="block text-center text-sm text-emerald-600 mt-4">← Volver al inicio</a>
        </div>
    </div>

    <!-- Panel de administración (oculto al inicio) -->
    <div id="panelAdmin" class="hidden">
        <nav class="bg-white shadow sticky top-0 z-50">
            <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-9 h-9 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-bold">PA</div>
                    <span class="font-bold text-emerald-700">Admin · Puertas Abiertas</span>
                </div>
                <div class="flex items-center gap-3">
                    <a href="buscar.html" class="text-sm text-gray-600">Ver sitio</a>
                    <button onclick="salir()" class="text-sm text-red-600">Salir</button>
                </div>
            </div>
        </nav>

        <div class="max-w-5xl mx-auto px-4 py-8">
            <h1 class="text-2xl font-bold mb-2">Casas publicadas</h1>
            <p class="text-gray-600 mb-6">
                Aquí puedes marcar como alquilada o eliminar las casas que ya no están disponibles.
            </p>

            <div id="listaAdmin" class="space-y-4">
                <!-- Se llena con JavaScript -->
            </div>

            <div id="vacioAdmin" class="hidden text-center py-16 text-gray-500">
                No hay casas publicadas.
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        var firebaseListo = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("TU_API_KEY") === -1;
        var casasAdmin = [];

        // Entrar con contraseña
        function entrar() {
            var clave = document.getElementById("inputClave").value;
            if (clave === CLAVE_ADMIN) {
                document.getElementById("pantallaLogin").classList.add("hidden");
                document.getElementById("panelAdmin").classList.remove("hidden");
                cargarListaAdmin();
            } else {
                alert("Contraseña incorrecta");
            }
        }

        // Permitir Enter en el input
        document.getElementById("inputClave").addEventListener("keyup", function (e) {
            if (e.key === "Enter") entrar();
        });

        function salir() {
            document.getElementById("panelAdmin").classList.add("hidden");
            document.getElementById("pantallaLogin").classList.remove("hidden");
            document.getElementById("inputClave").value = "";
        }

        // Cargar lista de casas
        function cargarListaAdmin() {
            var locales = [];
            try {
                locales = JSON.parse(localStorage.getItem("demo_propiedades") || "[]");
            } catch (e) {}

            casasAdmin = locales.slice();

            if (firebaseListo) {
                propertiesRef.orderBy("createdAt", "desc").get().then(function (snapshot) {
                    var desdeFirebase = [];
                    snapshot.forEach(function (doc) {
                        var data = doc.data();
                        data.id = doc.id;
                        data._esFirebase = true;
                        desdeFirebase.push(data);
                    });
                    casasAdmin = desdeFirebase.concat(locales);
                    dibujarListaAdmin();
                }).catch(function (err) {
                    console.log(err);
                    dibujarListaAdmin();
                });
            } else {
                dibujarListaAdmin();
            }
        }

        function dibujarListaAdmin() {
            var contenedor = document.getElementById("listaAdmin");
            var vacio = document.getElementById("vacioAdmin");
            contenedor.innerHTML = "";

            if (casasAdmin.length === 0) {
                vacio.classList.remove("hidden");
                return;
            }
            vacio.classList.add("hidden");

            for (var i = 0; i < casasAdmin.length; i++) {
                var casa = casasAdmin[i];
                var foto = (casa.imagenes && casa.imagenes[0]) ? casa.imagenes[0] : "";
                var estado = casa.activo === false ? "ALQUILADA / INACTIVA" : "ACTIVA";
                var colorEstado = casa.activo === false ? "bg-red-100 text-red-700" : "bg-green-100 text-green-700";

                var card = document.createElement("div");
                card.className = "bg-white rounded-xl shadow p-4 flex flex-col sm:flex-row gap-4 items-start";

                card.innerHTML =
                    (foto ? '<img src="' + foto + '" class="w-full sm:w-32 h-24 object-cover rounded-lg">' : '') +
                    '<div class="flex-1">' +
                        '<div class="flex flex-wrap items-center gap-2 mb-1">' +
                            '<span class="font-bold">' + (casa.titulo || "Sin título") + '</span>' +
                            '<span class="text-xs px-2 py-0.5 rounded-full ' + colorEstado + '">' + estado + '</span>' +
                        '</div>' +
                        '<p class="text-sm text-gray-600">' + (casa.direccion || "") + '</p>' +
                        '<p class="text-sm text-emerald-700 font-semibold">Bs ' + (casa.precio || 0) + ' / mes</p>' +
                        '<p class="text-xs text-gray-400 mt-1">Dueño: ' + (casa.nombre || "") + ' · WA: ' + (casa.whatsapp || "") + '</p>' +
                    '</div>' +
                    '<div class="flex flex-row sm:flex-col gap-2 w-full sm:w-auto">' +
                        (casa.activo !== false ?
                            '<button onclick="marcarAlquilada(\'' + casa.id + '\', ' + (casa._esFirebase ? "true" : "false") + ')" ' +
                                'class="bg-orange-500 hover:bg-orange-600 text-white text-sm px-4 py-2 rounded-xl whitespace-nowrap">' +
                                'Marcar alquilada' +
                            '</button>'
                        : '') +
                        '<button onclick="eliminarCasa(\'' + casa.id + '\', ' + (casa._esFirebase ? "true" : "false") + ')" ' +
                            'class="bg-red-500 hover:bg-red-600 text-white text-sm px-4 py-2 rounded-xl whitespace-nowrap">' +
                            'Eliminar' +
                        '</button>' +
                    '</div>';

                contenedor.appendChild(card);
            }
        }

        // Marcar como alquilada (activo = false)
        async function marcarAlquilada(id, esFirebase) {
            if (!confirm("¿Marcar esta casa como alquilada? Dejará de verse en el sitio.")) {
                return;
            }

            if (esFirebase && firebaseListo) {
                try {
                    await propertiesRef.doc(id).update({ activo: false });
                    alert("Casa marcada como alquilada");
                    cargarListaAdmin();
                } catch (e) {
                    alert("Error: " + e.message);
                }
            } else {
                // Modo demo (localStorage)
                var lista = JSON.parse(localStorage.getItem("demo_propiedades") || "[]");
                for (var i = 0; i < lista.length; i++) {
                    if (lista[i].id === id) {
                        lista[i].activo = false;
                    }
                }
                localStorage.setItem("demo_propiedades", JSON.stringify(lista));
                alert("Casa marcada como alquilada (modo demo)");
                cargarListaAdmin();
            }
        }

        // Eliminar completamente
        async function eliminarCasa(id, esFirebase) {
            if (!confirm("¿Eliminar esta casa definitivamente?")) {
                return;
            }

            if (esFirebase && firebaseListo) {
                try {
                    await propertiesRef.doc(id).delete();
                    alert("Casa eliminada");
                    cargarListaAdmin();
                } catch (e) {
                    alert("Error: " + e.message);
                }
            } else {
                var lista = JSON.parse(localStorage.getItem("demo_propiedades") || "[]");
                var nueva = [];
                for (var i = 0; i < lista.length; i++) {
                    if (lista[i].id !== id) {
                        nueva.push(lista[i]);
                    }
                }
                localStorage.setItem("demo_propiedades", JSON.stringify(nueva));
                alert("Casa eliminada (modo demo)");
                cargarListaAdmin();
            }
        }
    </script>
</body>
</html>
